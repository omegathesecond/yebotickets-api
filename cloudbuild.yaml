steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yebotickets-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # ADDITIVE secret binding (per CLAUDE.md: --update-secrets, never
      # --set-secrets, so a deploy never silently wipes bindings applied out
      # of band — e.g. the R2_* media creds bound to yebotickets-api-prod).
      - '--update-secrets'
      - 'DATABASE_URL=yebotickets-database-url:latest,R2_ACCESS_KEY_ID=YEBOTICKETS__R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=YEBOTICKETS__R2_SECRET_ACCESS_KEY:latest,R2_ENDPOINT=YEBOTICKETS__R2_ENDPOINT:latest,R2_BUCKET_NAME=YEBOTICKETS__R2_BUCKET_NAME:latest,R2_PUBLIC_URL=YEBOTICKETS__R2_PUBLIC_URL:latest'

images:
  - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
