steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'yebotickets-runtime@hiyebo.iam.gserviceaccount.com'
      # ADDITIVE secret binding (per CLAUDE.md: --update-secrets, never
      # --set-secrets, so a deploy never silently wipes bindings applied out
      # of band — e.g. the YEBOPAY_*/YEBOLINK_API_KEY/INTERNAL_API_KEY creds
      # bound to yebotickets-api-prod/-dev). Secret names are parameterised
      # via substitutions so the dev trigger can point at the _DEV secrets
      # instead of prod's without touching this file.
      - '--update-secrets'
      - 'DATABASE_URL=${_DATABASE_URL_SECRET}:latest,R2_ACCESS_KEY_ID=${_R2_ACCESS_KEY_ID_SECRET}:latest,R2_SECRET_ACCESS_KEY=${_R2_SECRET_ACCESS_KEY_SECRET}:latest,R2_ENDPOINT=${_R2_ENDPOINT_SECRET}:latest,R2_BUCKET_NAME=${_R2_BUCKET_NAME_SECRET}:latest,R2_PUBLIC_URL=${_R2_PUBLIC_URL_SECRET}:latest,YEBOPAY_API_KEY=${_YEBOPAY_API_KEY_SECRET}:latest,YEBOPAY_WEBHOOK_SECRET=${_YEBOPAY_WEBHOOK_SECRET_SECRET}:latest'
      # Which YeboPay gateway to talk to. The host is yebopay.APP —
      # api.yebopay.com is an unrelated third-party site, so this must never be
      # left to drift. Dev overrides it to https://dev-api.yebopay.app.
      #
      # PLATFORM_FEE_PERCENT is the platform's commission on ticket sales, read
      # by the organizer settlement calculation. Defaults to 0 (organizers are
      # owed 100% of gross) until the business sets a rate; change it via the
      # trigger substitution, never by hand, so a redeploy cannot reset it.
      - '--update-env-vars'
      - 'YEBOPAY_BASE_URL=${_YEBOPAY_BASE_URL},PLATFORM_FEE_PERCENT=${_PLATFORM_FEE_PERCENT}'

images:
  - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'

substitutions:
  # Defaults target prod; the yebotickets-api-dev trigger overrides these
  # (already configured via `gcloud builds triggers` — see
  # yebotickets-api-dev trigger substitutions) to point _SERVICE at
  # yebotickets-api-dev and the secrets at their _DEV counterparts so a
  # dev build never binds the prod database or R2 bucket.
  _SERVICE: 'yebotickets-api-prod'
  _DATABASE_URL_SECRET: 'YEBOTICKETS__DATABASE_URL'
  _R2_ACCESS_KEY_ID_SECRET: 'YEBOTICKETS__R2_ACCESS_KEY_ID'
  _R2_SECRET_ACCESS_KEY_SECRET: 'YEBOTICKETS__R2_SECRET_ACCESS_KEY'
  _R2_ENDPOINT_SECRET: 'YEBOTICKETS__R2_ENDPOINT'
  _R2_BUCKET_NAME_SECRET: 'YEBOTICKETS__R2_BUCKET_NAME'
  _R2_PUBLIC_URL_SECRET: 'YEBOTICKETS__R2_PUBLIC_URL'
  # Same additive-secret pattern for YeboPay: the dev trigger overrides these
  # three with their _DEV counterparts (and _YEBOPAY_BASE_URL with
  # https://dev-api.yebopay.app) so a dev deploy can never take real money
  # through the live gateway.
  _YEBOPAY_API_KEY_SECRET: 'YEBOTICKETS__YEBOPAY_API_KEY'
  _YEBOPAY_WEBHOOK_SECRET_SECRET: 'YEBOTICKETS__YEBOPAY_WEBHOOK_SECRET'
  _YEBOPAY_BASE_URL: 'https://api.yebopay.app'
  # Platform commission on ticket sales, as a percentage of gross. 0 = the
  # platform takes nothing, which is today's behaviour. Must be >= 0 and < 100;
  # a non-numeric value makes the API fail loudly rather than quietly settle at
  # 0% and give away the platform's revenue.
  _PLATFORM_FEE_PERCENT: '0'

options:
  logging: CLOUD_LOGGING_ONLY
