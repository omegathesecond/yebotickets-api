steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yebotickets-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'DATABASE_URL=yebotickets-database-url:latest'

images:
  - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
