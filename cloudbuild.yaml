# Deploy path: GitHub push to `main` -> Cloud Build trigger `yebotickets-api-prod`
# (id 5fb2c161-6583-4417-82a2-d9521a6e9cd2, region europe-west1) -> this file
# -> Cloud Run yebotickets-api-prod. `dev` -> trigger `yebotickets-api-dev`
# (id 48b75f9e-4186-4730-9792-68ccf10dd96c, region europe-west1) ->
# yebotickets-api-dev.
#
# 2026-09-07: found this trigger had 0 successful runs since 2026-04-26 (both
# builds that day failed on the `gcloud run deploy` step, back when this file
# still deployed the wrong service name with a destructive --set-secrets — see
# git history). The service kept getting new revisions anyway because someone
# was deploying by hand (`gcloud run deploy --source .` as the deployer SA,
# visible as `run.googleapis.com/client-name: gcloud` + a
# `gs://run-sources-...` source annotation on the revision, NOT a Cloud Build
# git-triggered image) instead of via this pipeline — main had drifted ~5
# merged commits ahead of what was actually live in prod. The prod trigger
# (57a3ccdc) was at some point deleted and recreated as 04122141 on 2026-09-04,
# which is the standard fix for a Cloud Build GitHub-App trigger whose webhook
# stopped delivering — re-verified working here: `gcloud builds triggers run
# 04122141... --branch=main` built + deployed main HEAD cleanly to
# yebotickets-api-prod-00007 (IAM, cloudbuild.yaml, secrets all correct).
#
# 2026-09-14: prod was broken again — api.yebotickets.com was 404ing on the
# payment routes because 04122141 (a 1st-gen GitHub-App trigger, matched by
# stored owner/name string) never fired after GitHub repo
# omegathesecond/Yebo-tickets-api was renamed to omegathesecond/yebotickets-api
# (same repo id 943240152). Cloud Build's 1st-gen "repository mapping" cache
# doesn't follow a GitHub rename and `gcloud builds triggers update github
# --repo-name=...` / recreating a 1st-gen trigger against the new name both
# fail with FAILED_PRECONDITION "Repository mapping does not exist" — the
# console's "Connect Repository" re-sync wizard is interactive-only, no gcloud
# equivalent. Fixed by moving to a 2nd-gen Cloud Build connection instead
# (mirrors the yebocars/yeboshops fix for the same GitHub-rename failure mode):
# `builds connections create github yebotickets-gh` (region europe-west1,
# reusing the already-authorized GitHub App installation 79785349 +
# yeboshops-gh-github-oauthtoken-8cff79 secret) -> `builds repositories create
# yebotickets-api --connection=yebotickets-gh
# --remote-uri=https://github.com/omegathesecond/yebotickets-api.git` ->
# recreated both triggers with `--repository=.../connections/yebotickets-gh/
# repositories/yebotickets-api` in europe-west1, then deleted the dead 1st-gen
# global triggers (04122141, 219c5f43). Verified live: a real `git push
# origin main` (not just `triggers run`) fired build 0a016141 via the actual
# GitHub webhook -> SUCCESS -> yebotickets-api-prod now serves
# gcr.io/hiyebo/yebotickets-api:<COMMIT_SHA>, and
# api.yebotickets.com/api/tickets/payment-options + POST /api/payments/webhook
# both went from 404 to 401. NOTE: the `dev` trigger is now correctly wired
# the same way (fires + builds + pushes images off a real push to `dev`), but
# `dev` branch itself still carries an ancient, pre-Prisma cloudbuild.yaml
# (hardcoded service name `yebotickets-api`, secret `yebotickets-database-url`,
# destructive --set-secrets) — dev has diverged 54 commits behind / 12 commits
# ahead of main since a very early MongoDB-era branch point, so the dev Cloud
# Run deploy step still fails on secret permissions until someone decides how
# to reconcile dev with main's history (out of scope here — this fix only
# covers the trigger/repo binding, not dev's stale branch content).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'yebotickets-runtime@hiyebo.iam.gserviceaccount.com'
      # ADDITIVE secret binding (per CLAUDE.md: --update-secrets, never
      # --set-secrets, so a deploy never silently wipes bindings applied out
      # of band — e.g. the YEBOPAY_*/YEBOLINK_API_KEY/INTERNAL_API_KEY creds
      # bound to yebotickets-api-prod/-dev). Secret names are parameterised
      # via substitutions so the dev trigger can point at the _DEV secrets
      # instead of prod's without touching this file.
      - '--update-secrets'
      - 'DATABASE_URL=${_DATABASE_URL_SECRET}:latest,R2_ACCESS_KEY_ID=${_R2_ACCESS_KEY_ID_SECRET}:latest,R2_SECRET_ACCESS_KEY=${_R2_SECRET_ACCESS_KEY_SECRET}:latest,R2_ENDPOINT=${_R2_ENDPOINT_SECRET}:latest,R2_BUCKET_NAME=${_R2_BUCKET_NAME_SECRET}:latest,R2_PUBLIC_URL=${_R2_PUBLIC_URL_SECRET}:latest,YEBOPAY_API_KEY=${_YEBOPAY_API_KEY_SECRET}:latest,YEBOPAY_WEBHOOK_SECRET=${_YEBOPAY_WEBHOOK_SECRET_SECRET}:latest'
      # Which YeboPay gateway to talk to. The host is yebopay.APP —
      # api.yebopay.com is an unrelated third-party site, so this must never be
      # left to drift. Dev overrides it to https://dev-api.yebopay.app.
      #
      # PLATFORM_FEE_PERCENT is the platform's commission on ticket sales, read
      # by the organizer settlement calculation. Defaults to 0 (organizers are
      # owed 100% of gross) until the business sets a rate; change it via the
      # trigger substitution, never by hand, so a redeploy cannot reset it.
      - '--update-env-vars'
      - 'YEBOPAY_BASE_URL=${_YEBOPAY_BASE_URL},PLATFORM_FEE_PERCENT=${_PLATFORM_FEE_PERCENT}'

images:
  - 'gcr.io/$PROJECT_ID/yebotickets-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/yebotickets-api:latest'

substitutions:
  # Defaults target prod; the yebotickets-api-dev trigger overrides these
  # (already configured via `gcloud builds triggers` — see
  # yebotickets-api-dev trigger substitutions) to point _SERVICE at
  # yebotickets-api-dev and the secrets at their _DEV counterparts so a
  # dev build never binds the prod database or R2 bucket.
  _SERVICE: 'yebotickets-api-prod'
  _DATABASE_URL_SECRET: 'YEBOTICKETS__DATABASE_URL'
  _R2_ACCESS_KEY_ID_SECRET: 'YEBOTICKETS__R2_ACCESS_KEY_ID'
  _R2_SECRET_ACCESS_KEY_SECRET: 'YEBOTICKETS__R2_SECRET_ACCESS_KEY'
  _R2_ENDPOINT_SECRET: 'YEBOTICKETS__R2_ENDPOINT'
  _R2_BUCKET_NAME_SECRET: 'YEBOTICKETS__R2_BUCKET_NAME'
  _R2_PUBLIC_URL_SECRET: 'YEBOTICKETS__R2_PUBLIC_URL'
  # Same additive-secret pattern for YeboPay: the dev trigger overrides these
  # three with their _DEV counterparts (and _YEBOPAY_BASE_URL with
  # https://dev-api.yebopay.app) so a dev deploy can never take real money
  # through the live gateway.
  _YEBOPAY_API_KEY_SECRET: 'YEBOTICKETS__YEBOPAY_API_KEY'
  _YEBOPAY_WEBHOOK_SECRET_SECRET: 'YEBOTICKETS__YEBOPAY_WEBHOOK_SECRET'
  _YEBOPAY_BASE_URL: 'https://api.yebopay.app'
  # Platform commission on ticket sales, as a percentage of gross. 0 = the
  # platform takes nothing, which is today's behaviour. Must be >= 0 and < 100;
  # a non-numeric value makes the API fail loudly rather than quietly settle at
  # 0% and give away the platform's revenue.
  _PLATFORM_FEE_PERCENT: '0'

options:
  logging: CLOUD_LOGGING_ONLY
