name: CI & Deploy to Cloud Run
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master, dev]
env:
  PROJECT_ID: yebotickets
  REGION: europe-west1
  SERVICE: yebotickets-api
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run tests
        run: npm test
  deploy:
    # Only deploy on a push to a release branch; PRs run the test job only.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & Deploy
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build -t gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }} .
          docker push gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }}
          gcloud run deploy $SERVICE \
            --image gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }} \
            --region $REGION --platform managed --allow-unauthenticated \
            --project $PROJECT_ID \
            --set-secrets 'DATABASE_URL=yebotickets-database-url:latest'
